# QA: demonstrates the auth-required configuration pattern for a secured environment.
# NOTE: jsonplaceholder.typicode.com does not actually validate this token - it is a
# placeholder. When pointing this framework at a real secured API, set base.url below
# and either replace bearer.token or export API_BEARER_TOKEN (preferred for CI/CD).
base.url=https://jsonplaceholder.typicode.com
auth.required=true
bearer.token=REPLACE_WITH_YOUR_TOKEN
