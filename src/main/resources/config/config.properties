# Shared defaults applied to every environment. Environment-specific files
# (config-DEV.properties, config-QA.properties, ...) override individual keys.

connection.timeout=10000
socket.timeout=10000

# Performance regression thresholds - percentage deviation from the rolling
# average of the last N runs (see performance.history.size) that triggers a
# regression warning. See RegressionDetector.
regression.threshold.responsetime.percent=20
regression.threshold.throughput.percent=15
regression.threshold.errorrate.percent=5
performance.history.size=5

# Fixed SLA thresholds shown in the Performance Report's "Assertion Summary" - these are
# absolute pass/fail targets for a single run, independent of the rolling-average
# regression checks above.
performance.sla.errorrate.max.percent=20
performance.sla.throughput.min=1
performance.sla.avgresponse.max.ms=500
performance.sla.p90.max.ms=500
